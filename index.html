<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/logo.svg">
    <title>Pet Shop</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="imagens/logo.jpeg" alt="logo da codi">
        </div>
        <div class="paragrafo">
            <p class="Nome da empresa">Codi PetShop</p>
        </div>
    
        <div class="links">
            <ul>
                <li> <a href="#">Home</a></li>
                <li> <a href="#">Loja</a></li>
                <li> <a href="#">Sobre Nós</a></li>
                <li> <a href="#">Carrinho</a></li>
                <li> <a href="#">Entrar</a></li>

            </ul>
        </div>
    </nav>
   <main>
    <div class="container">
        <div class="card">
            <img src="imagens/racao.jpeg" alt="ração" width="180" height="180">
            <p class="nome">Ração de Gato</p>
            <p class="preco">R$119,90</p>
            <button type+"button">Adcionar ao carrinho</button>
        </div>
        <div class="card">
            <img src="imagens/bolinha.jpeg" alt="Bolinha" width="180" height="180">
            <p class="nome">Bolinha pra Gatp</p>
            <p class="preco">R$19,90</p>
            <button type-="button">Adcionar ao carrinho</button>
        </div>
  
        <div class="card">
            <img src="imagens/shampoo.jpeg" alt="shampoo"  width="180" height="180">
            <p class="nome">Shampoo Neutro</p>
            <p class="preco">R$34.90</p>
             <button type-="button">Adcionar ao carrinho</button>
        </div>
        
        <div class="card">
            <img src="imagens/luva.jpeg"luva"  width="180" height="180">
            <p class="nome">Luva para Escovar</p>
            <p class="preco">R$14,90</p>
            <button type="button">Adcionar ao carrinho</button>
        </div>
   
        <div class="card">
            <img src="imagens/tijela.jpeg" alt="tijela"  width="180" height="180">
            <p class="nome">Tijela</p>
            <p class="preco">R$29,90</p>
            <button type="button">Adcionar ao carrinho</button>
        </div>

        <div class="card">
            <img src="imagens/camadegato.png" alt="caminha"  width="180" height="180">
            <p class="nome">Caminha pra Gato</p>
            <p class="preco">R$79,90</p>
            <button type="button">Adcionar ao carrinho</button>
        </div>
    </main>
   
</body>
</html>
